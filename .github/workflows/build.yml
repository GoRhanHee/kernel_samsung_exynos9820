name: KernelSU Build (beyond1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: 1. Import kernel source
      uses: actions/checkout@v4   
      
    - name: 2. Install Package
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libncurses5-dev git curl clang lld libelf-dev erofs-utils

    - name: 3. Setting Permission
      run: chmod +x build.sh

    - name: 4. Kernel Build
      run: |   
        ./build.sh

    - name: 5. Upload Artifacts Kernel File
      uses: actions/upload-artifact@v4
      with:
        name: "beyond1_kernelsu_OUTPUT"
        path: |
          ./out/**

    - name: 6. Upload Artifacts Kernel File
      uses: actions/upload-artifact@v4
      with:
        name: "beyond1_kernelsu"
        path: |
          ./gorhanhee/AnyKernel3/beyond1lte_kernelsu.zip